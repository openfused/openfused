[package]
name = "openfused"
version = "0.5.0"
edition = "2021"
description = "OpenFused — the file protocol for AI agent context. CLI + daemon."
license = "MIT"
repository = "https://github.com/openfused/openfused"
readme = "README.md"

[[bin]]
name = "openfuse"
path = "src/main.rs"

[features]
default = ["daemon"]
daemon = [
    "axum",
    "tower-http",
    "tokio-stream",
    "subtle",
    "fs2",
    "tracing",
    "tracing-subscriber",
]

[dependencies]
openfused-core = { path = "../openfuse-core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nanoid = "0.4"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"
hex = "0.4"
rand = "0.8"

# Daemon-only deps (behind "daemon" feature)
axum = { version = "0.8", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", optional = true }
subtle = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
