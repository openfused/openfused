[package]
name = "openfused"
version = "0.5.4"
edition = "2021"
description = "OpenFused — the file protocol for AI agent context. CLI + daemon."
license = "MIT"
repository = "https://github.com/openfused/openfused"
readme = "README.md"

[lib]
name = "openfused"
path = "src/lib.rs"

[[bin]]
name = "openfuse"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "openfused-core"
path = "src/bin/wasm-core.rs"

[features]
default = ["cli", "daemon"]
cli = [
    "clap",
    "nanoid",
    "notify",
    "tokio",
    "reqwest",
    "regex",
]
daemon = [
    "cli",
    "axum",
    "tower-http",
    "tokio-stream",
    "subtle",
    "fs2",
    "tracing",
    "tracing-subscriber",
]

[dependencies]
# Core deps (always compiled — used by lib and WASM binary)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
hex = "0.4"
age = "0.11"
sha2 = "0.10"

# CLI deps (behind "cli" feature — not compiled for WASM)
clap = { version = "4", features = ["derive", "env"], optional = true }
nanoid = { version = "0.4", optional = true }
notify = { version = "7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
regex = { version = "1", optional = true }

# Daemon deps (behind "daemon" feature)
axum = { version = "0.8", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", optional = true }
subtle = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[profile.release]
lto = true
strip = true
panic = "abort"
